{% extends "base.html" %}
{% block public_content %}
<div style="max-width:560px;margin:0 auto;">
  <div class="auth-card">
    <div class="auth-logo"></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join MedLink Uganda</p>

    <div class="tab-switch" id="tabs">
      <button class="tab-btn active" onclick="switchTab('patient')">Patient / Public</button>
      <button class="tab-btn" onclick="switchTab('facility')">Clinic / Pharmacy / Supplier</button>
    </div>

    <!-- PATIENT FORM -->
    <form method="POST" id="form-patient">
      <input type="hidden" name="step" value="patient">
      <div class="form-row">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" name="name" required placeholder="Jane Apio">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" placeholder="+256 700 000 000">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="At least 6 characters">
      </div>
      <p class="form-hint" style="margin-bottom:12px;">Patient accounts can search for nearby medicine without any facility access.</p>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create patient account</button>
    </form>

    <!-- FACILITY FORM -->
    <form method="POST" id="form-facility" style="display:none;">
      <input type="hidden" name="step" value="facility">
      <div class="card" style="background:#f9fafb;margin-bottom:16px;">
        <p style="font-size:12px;font-weight:600;color:#374151;margin-bottom:10px;">YOUR ACCOUNT</p>
        <div class="form-row">
          <div class="form-group">
            <label>Your name</label>
            <input type="text" name="name" required placeholder="Dr. Amara Okello">
          </div>
          <div class="form-group">
            <label>Your phone</label>
            <input type="text" name="phone" placeholder="+256 ...">
          </div>
        </div>
        <div class="form-group">
          <label>Your email</label>
          <input type="email" name="email" required placeholder="you@clinic.ug">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="At least 6 characters">
        </div>
      </div>

      <div class="card" style="background:#f9fafb;margin-bottom:16px;">
        <p style="font-size:12px;font-weight:600;color:#374151;margin-bottom:10px;">YOUR FACILITY</p>
        <div class="form-group">
          <label>Join existing facility</label>
          <select name="existing_facility_id">
            <option value="">— Register a new facility below —</option>
            {% for f in facilities %}
            <option value="{{ f.id }}">{{ f.name }} ({{ f.facility_type.replace('_',' ').title() }})</option>
            {% endfor %}
          </select>
          <p class="form-hint">Select if your facility is already registered.</p>
        </div>
        <div class="form-group">
          <label>Facility name</label>
          <input type="text" name="facility_name" placeholder="e.g. Kampala City Pharmacy">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Facility type</label>
            <select name="facility_type">
              {% for value, label in facility_types %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label>Level</label>
            <select name="level">
              <option value="">N/A</option>
              <option>HC2</option><option>HC3</option><option>HC4</option>
              <option>General Hospital</option><option>Regional Referral</option>
              <option>National Referral</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>District</label>
            <select name="district_id">
              <option value="">— Select —</option>
              {% for d in districts %}
              <option value="{{ d.id }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label>Country</label>
            <input type="text" name="country" value="Uganda">
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address" placeholder="Street, area, city">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Facility phone</label>
            <input type="text" name="facility_phone" placeholder="+256 ...">
          </div>
          <div class="form-group">
            <label>NDA Licence No.</label>
            <input type="text" name="licence_no" placeholder="Optional">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Latitude <span class="form-hint">(for map)</span></label>
            <input type="text" name="latitude" id="reg-lat" placeholder="e.g. 0.3476">
          </div>
          <div class="form-group">
            <label>Longitude</label>
            <input type="text" name="longitude" id="reg-lon" placeholder="e.g. 32.5825">
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="getLocation()">Use my GPS location</button>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Register facility & account</button>
    </form>

    <div class="auth-link">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
  </div>
</div>

<script>
function switchTab(type) {
  document.getElementById('form-patient').style.display = type === 'patient' ? '' : 'none';
  document.getElementById('form-facility').style.display = type === 'facility' ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b,i) =>b.classList.toggle('active', (i===0) === (type==='patient')));
}
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos =>{
      document.getElementById('reg-lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('reg-lon').value = pos.coords.longitude.toFixed(6);
    });
  }
}
</script>
{% endblock %}
