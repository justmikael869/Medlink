{% extends "base.html" %}
{% block public_content %}
<div class="auth-wrap" style="margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);width:100vw;min-height:calc(100vh - 60px);">
  <div class="auth-card">
    <div class="auth-logo"></div>
    <h1 class="auth-title">MedLink Uganda</h1>
    <p class="auth-sub">Medicine supply & finder platform</p>
    <form method="POST">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" required autofocus placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;">Sign in</button>
    </form>
    <div class="auth-foot" style="margin-top:10px;">
      <a href="{{ url_for('search.index') }}">Search without account →</a>
    </div>
  </div>
</div>
{% endblock %}
