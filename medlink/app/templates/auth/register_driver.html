{% extends "base.html" %}
{% block title %}Register as Driver — MedLink{% endblock %}
{% block content %}
<div style="max-width:500px;">
  <div class="page-header">
    <h1 class="page-title">Register as a Delivery Driver</h1>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Vehicle type</label>
        <select name="vehicle_type">
          <option value="boda">Boda Boda (Motorcycle)</option>
          <option value="car">Car</option>
          <option value="van">Van / Delivery Van</option>
        </select>
      </div>
      <div class="form-group">
        <label>Number plate *</label>
        <input name="plate_number" required placeholder="e.g. UAA 123B" style="text-transform:uppercase;">
      </div>
      <div class="form-group">
        <label class="checkbox-label" style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;">
          <input type="checkbox" name="has_cold_box" value="yes">
           I have a certified cold box (required for vaccine/insulin deliveries)
        </label>
      </div>
      <div style="background:#fef3c7;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;">
         Your profile will be reviewed by an admin before you can accept orders. Ensure your documents are ready.
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit Application</button>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
